<html>
<body>
<script>
// =============================================================
// SIDDU CHAT WIDGET: paste-in replacement
// In index.html, delete everything from the comment line that says
// "FAQ chatbot" (just above "const KB = [") down to, but NOT including,
// the closing script tag, and paste this whole file in its place.
// Everything above that point (OWNER, EMAIL, sendForm, ledger, contact
// form) stays exactly as it is.
// =============================================================

/* --------- Siddu: knowledge base (from the Siddu 24/7 Support Agent PDF) --------- */
const BOT = "Siddu";
const PHONE_TXT = "+91 78927 75885";
const BENCH = " Note: the 15-minute run was directly measured. The \"before\" figures (40 hrs, 10 hrs, 2 days) are industry benchmarks, not personally re-run by me.";
const GET_STARTED = "Book a free discovery call using the contact form on this page, or message TRISLOUTIONS on WhatsApp at " + PHONE_TXT + ". " + OWNER + " will schedule it.";

const KB = [
  /* ---- specific topics first, general ones later (ties go to the earlier entry) ---- */
  { chip: "Talk to the founder", keys: ["talk to","speak to","speak with","human","person","founder","trilochan","call me","contact me","callback","call back"],
    lead: true,
    a: OWNER + " built, debugged and verified all eight automations. I can pass your details to him." },

  { keys: ["price","pricing","cost","quote","fee","charge","how much","discount","budget","package","plan"],
    a: "I don't have pricing information. " + OWNER + " discusses that on a free discovery call. Book one using the contact form on this page, or message TRISLOUTIONS on WhatsApp at " + PHONE_TXT + "." },

  { keys: ["how long will","setup time","set up time","timeline","implementation","onboard","go live","delivery time","how soon","turnaround"],
    a: "I don't have a set timeline for new projects. " + OWNER + " can estimate after hearing what you want to automate. Book a free discovery call using the contact form on this page, or message TRISLOUTIONS on WhatsApp at " + PHONE_TXT + "." },

  { keys: ["software","tally","zoho","sap","quickbooks","erp","integrat","google sheets","sheets","excel","connect with","work with","tools"],
    a: "The builds described to me use Google Sheets as a data source. For any other system or software, please ask " + OWNER + " on a free discovery call using the contact form on this page, or message TRISLOUTIONS on WhatsApp at " + PHONE_TXT + "." },

  { keys: ["file my gst","file gst","filing return","file return","e-filing","efile","file my return","submit return","file tax"],
    a: "I am an information assistant for TRISLOUTIONS, not a tax practitioner, so I cannot log into GST or filing portals for you. I can tell you about the automations " + OWNER + " builds (like automated filing status tracking across multiple GSTINs). For actual filing services, contact " + OWNER + " via the contact form on this page." },

  { keys: ["whatsapp","message","chat on whatsapp"],
    a: "You can message TRISLOUTIONS on WhatsApp at " + PHONE_TXT + ". Or book a free discovery call using the contact form on this page." },

  { keys: ["email","mail","write to"],
    a: "You can email " + OWNER + " directly at " + EMAIL + ", or submit the contact form on this page." },

  { keys: ["8","eight","all","list","what automations","what do you do","services","offerings","capabilities"],
    a: OWNER + " has built eight verified automations:\n\n1. Multi-GSTIN Return Tracker (40 hrs -> 15 mins)\n2. Invoice & Bank Statement Auto-Reconciliation (10 hrs/wk -> minutes)\n3. Tally ERP / Prime Automated Data Sync\n4. Smart Vendor Payment & Approval Workflow\n5. Multi-Entity Financial Dashboard\n6. Automated Client Payment Reminders\n7. E-Way Bill & E-Invoice Generation\n8. Audit-Trail & Exception Flagging System\n\nWhich one would you like to know more about?" },

  { keys: ["1","tracker","multi-gstin","gstin","filing status"],
    a: "1. Multi-GSTIN Return Tracker\nTracks filing status across multiple GSTINs, pulling data directly into a unified dashboard, cutting tracking time from 40 hours to 15 minutes." + BENCH },

  { keys: ["2","reconciliation","reconcile","bank statement","invoice"],
    a: "2. Invoice & Bank Statement Auto-Reconciliation\nMatches invoices against bank statements automatically, reducing weekly reconciliation work from 10 hours down to minutes." + BENCH },

  { keys: ["3","tally","prime","erp","sync"],
    a: "3. Tally ERP / Prime Automated Data Sync\nSyncs vouchers and ledger data between Tally and report sheets automatically, avoiding manual double entry." },

  { keys: ["4","vendor","approval","workflow","payment approval"],
    a: "4. Smart Vendor Payment & Approval Workflow\nRoutes vendor bills for approval based on thresholds and flags discrepancies before payment." },

  { keys: ["5","multi-entity","dashboard","group","consolidat"],
    a: "5. Multi-Entity Financial Dashboard\nConsolidates balances and P&L across multiple group entities into a single live view." },

  { keys: ["6","reminder","client payment","chase","overdue"],
    a: "6. Automated Client Payment Reminders\nSends scheduled WhatsApp/email reminders for outstanding invoices before and after due dates." },

  { keys: ["7","e-way","e-invoice","eway","einvoice","irn"],
    a: "7. E-Way Bill & E-Invoice Generation\nGenerates IRNs and E-Way bills directly from sales data without repetitive portal entry." },

  { keys: ["8","audit","exception","flag","discrepancy"],
    a: "8. Audit-Trail & Exception Flagging System\nMonitors transaction logs for duplicates, tax-rate mismatches, or missing fields, flagging them for human review." },

  { keys: ["benchmarks","40 hrs","10 hrs","measured","2 days","accuracy","industry","disclaimer"],
    a: BENCH },

  { keys: ["who built","who created","who made","trilochan","founder","about","who are you","who is"],
    a: "TRISLOUTIONS is founded by " + OWNER + " (" + EMAIL + "). He personally built, debugged and verified all eight automations featured on this page." },

  { keys: ["call","book","discovery","consultation","schedule","meeting","get started","hire","work with","next step"],
    a: GET_STARTED },

  { keys: ["hi","hello","hey","good morning","good afternoon","good evening","greetings","start"],
    a: "Hello! I'm " + BOT + ", AI assistant for TRISLOUTIONS. Ask me about our eight verified finance & tax automations, or click a topic below:" }
];

const FALLBACK = "I don't have exact details on that. " + GET_STARTED;

/* --------- State --------- */
let leadState = null; // null | 'name' | 'email' | 'phone' | 'msg'
let leadData = {};

/* --------- Engine --------- */
function clean(s) {
  return s.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
}

function reply(text) {
  const norm = clean(text);
  if (!norm) return "Please type a question or choose one of the options below.";

  // Exact lead trigger phrases
  if (norm === "talk to the founder" || norm === "talk to founder" || norm === "speak to founder") {
    startLead();
    return "I can pass your contact details to " + OWNER + ". What is your name?";
  }

  // Active lead flow
  if (leadState) return handleLeadStep(text);

  let best = null, bestScore = 0;
  for (const item of KB) {
    let score = 0;
    for (const k of item.keys) {
      if (norm.includes(k)) score += k.length;
    }
    if (score > bestScore) { bestScore = score; best = item; }
  }

  if (best) {
    if (best.lead && !leadState) {
      startLead();
      return best.a + "\n\nLet's start - what is your name?";
    }
    return best.a;
  }
  return FALLBACK;
}

function startLead() {
  leadState = 'name';
  leadData = {};
}

function handleLeadStep(text) {
  const input = text.trim();
  if (leadState === 'name') {
    leadData.name = input;
    leadState = 'email';
    return "Thanks, " + input + ". What is your email address?";
  }
  if (leadState === 'email') {
    leadData.email = input;
    leadState = 'phone';
    return "Got it. What is your phone / WhatsApp number?";
  }
  if (leadState === 'phone') {
    leadData.phone = input;
    leadState = 'msg';
    return "And briefly, what would you like to discuss with " + OWNER + "?";
  }
  if (leadState === 'msg') {
    leadData.msg = input;
    leadState = null;
    // auto-fill main form if present
    try {
      const fn = document.getElementById('name') || document.querySelector('input[name="name"]');
      const fe = document.getElementById('email') || document.querySelector('input[name="email"]');
      const fp = document.getElementById('phone') || document.querySelector('input[name="phone"]');
      const fm = document.getElementById('message') || document.querySelector('textarea[name="message"]');
      if (fn) fn.value = leadData.name;
      if (fe) fe.value = leadData.email;
      if (fp) fp.value = leadData.phone;
      if (fm) fm.value = "Chatbot lead: " + leadData.msg;
    } catch (e) {}

    // Record to local ledger
    if (typeof ledger !== 'undefined' && Array.isArray(ledger)) {
      ledger.push({ timestamp: new Date().toISOString(), ...leadData });
    }

    return "Thank you! I've saved your details. " + OWNER + " will reach out to you shortly. You can also message TRISLOUTIONS directly on WhatsApp at " + PHONE_TXT + ".";
  }
}

/* --------- DOM Binding --------- */
function addMsg(text, sender) {
  const box = document.getElementById('chat-messages');
  if (!box) return;
  const div = document.createElement('div');
  div.style.margin = '8px 0';
  div.style.textAlign = sender === 'user' ? 'right' : 'left';
  const span = document.createElement('span');
  span.style.display = 'inline-block';
  span.style.padding = '8px 12px';
  span.style.borderRadius = '12px';
  span.style.maxWidth = '80%';
  span.style.whiteSpace = 'pre-wrap';
  span.style.fontSize = '14px';
  span.style.lineHeight = '1.4';
  if (sender === 'user') {
    span.style.background = '#0070f3';
    span.style.color = '#fff';
  } else {
    span.style.background = '#f0f0f0';
    span.style.color = '#111';
  }
  span.textContent = text;
  div.appendChild(span);
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function sendChat() {
  const inp = document.getElementById('chat-input');
  if (!inp) return;
  const txt = inp.value;
  if (!txt.trim()) return;
  addMsg(txt, 'user');
  inp.value = '';
  setTimeout(() => {
    addMsg(reply(txt), 'bot');
  }, 300);
}

function clickChip(txt) {
  addMsg(txt, 'user');
  setTimeout(() => {
    addMsg(reply(txt), 'bot');
  }, 300);
}

// Auto-greeting on load
document.addEventListener('DOMContentLoaded', () => {
  const box = document.getElementById('chat-messages');
  if (box && box.children.length === 0) {
    addMsg("Hello! I'm " + BOT + ", AI assistant for TRISLOUTIONS. Ask me about our eight verified finance & tax automations, or click a topic below:", 'bot');
  }
  const btn = document.getElementById('chat-send');
  if (btn) btn.onclick = sendChat;
  const inp = document.getElementById('chat-input');
  if (inp) {
    inp.onkeypress = (e) => { if (e.key === 'Enter') sendChat(); };
  }
});
</script>
</body>
</html>
