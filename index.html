<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRISLOUTIONS | Finance Automation</title>
  <link rel="icon" type="image/jpeg" href="logo.png.jpg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b132b; color: #ffffff; line-height: 1.6; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 2rem; background: #1c2541; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .brand { display: flex; align-items: center; text-decoration: none; color: #fff; gap: 12px; }
    .brand img { height: 42px; width: auto; object-fit: contain; }
    .brand-title { font-size: 1.25rem; font-weight: 700; color: #d4af37; letter-spacing: 0.5px; }
    .container { max-width: 960px; margin: 4rem auto; padding: 0 1.5rem; text-align: center; }
    h1 { font-size: 2.75rem; margin-bottom: 1rem; color: #ffffff; }
    p { font-size: 1.2rem; color: #cbd5e1; max-width: 650px; margin: 0 auto 2rem; }
    .cta-btn { display: inline-block; padding: 0.85rem 1.8rem; background: #d4af37; color: #0b132b; font-weight: bold; text-decoration: none; border-radius: 6px; }
  </style>
</head>
<body>
  <header>
    <a href="#" class="brand">
      <img src="logo.png.jpg" alt="TRISLOUTIONS Logo">
      <span class="brand-title">TRISLOUTIONS</span>
    </a>
  </header>
  <main class="container">
    <h1>Finance Automation Solutions</h1>
    <p>Streamline workflows, automate reports, and scale operational efficiency.</p>
    <a href="#contact" class="cta-btn">Get Started</a>
  </main>
</body>
</html>
